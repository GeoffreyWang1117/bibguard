[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibguard"
version = "0.4.0"
description = "Detect hallucinated and broken citations in academic papers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Geoffrey Wang", email = "geoffreywang1117@gmail.com" },
]
keywords = [
    "citation", "verification", "hallucination", "academic", "bibtex",
    "reference", "integrity", "latex", "scholarly", "bibguard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "bibtexparser>=1.4,<2",
]

[project.optional-dependencies]
fast = ["rapidfuzz>=3.0"]
pdf = ["pymupdf>=1.23"]
all = ["rapidfuzz>=3.0", "pymupdf>=1.23"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
bibguard = "bibguard.cli:main"

[project.urls]
Homepage = "https://geoffreywang1117.github.io/bibguard/"
Repository = "https://github.com/GeoffreyWang1117/bibguard"
Issues = "https://github.com/GeoffreyWang1117/bibguard/issues"
Changelog = "https://github.com/GeoffreyWang1117/bibguard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bibguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
